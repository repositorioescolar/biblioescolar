<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão e Circulação de Acervo Escolar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- SheetJS (XLSX Import/Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableSheet, #printableSheet * { visibility: visible; }
      #printableSheet { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- TELA INICIAL: CONSULTA PÚBLICA (MULTIBUSCA) / LOGIN -->
  <div id="loginOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-85 backdrop-blur-sm z-50 overflow-y-auto flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-2xl w-full border border-slate-200 my-auto space-y-6">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-700 rounded-full mb-3">
          <i class="ph-bold ph-books text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Biblioteca Escolar</h2>
        <p class="text-slate-500 text-sm mt-1">Multibusca Global no Acervo e Circulação</p>
      </div>

      <div id="loginAlert" class="hidden p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-lg text-center"></div>

      <!-- ABAS DE NAVEGAÇÃO INICIAL -->
      <div class="flex border-b text-sm font-semibold">
        <button type="button" onclick="switchAuthTab('public')" id="authTabPublic" class="flex-1 py-2 text-blue-700 border-b-2 border-blue-700 text-center cursor-pointer font-bold">Consulta Pública (Multibusca)</button>
        <button type="button" onclick="switchAuthTab('login')" id="authTabLogin" class="flex-1 py-2 text-slate-500 text-center cursor-pointer">Acesso Restrito Operador</button>
      </div>

      <!-- PAINEL MULTIBUSCA PÚBLICA -->
      <div id="authPanelPublic" class="space-y-4">
        <p class="text-xs text-slate-600 font-medium">Multibuscador Global — Pesquise por qualquer termo ou campo (parcial ou completo):</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
          <div>
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Título</label>
            <input type="text" id="pubTitle" placeholder="Termo no título..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Autor</label>
            <input type="text" id="pubAuthor" placeholder="Termo no autor..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Assunto / Termo Livre</label>
            <input type="text" id="pubSubject" placeholder="Termo livre..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 items-center pt-1">
          <div>
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Regra de Combinação</label>
            <select id="pubBoolOp" class="w-full px-3 py-2 border rounded-lg text-xs bg-slate-50 font-semibold text-slate-700 focus:ring-2 focus:ring-blue-500">
              <option value="AND">E (Todos os critérios juntos)</option>
              <option value="OR">OU (Qualquer um dos critérios)</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-wider block mb-1">Exclusão (NÃO conter termo)</label>
            <input type="text" id="pubNotSubject" placeholder="Termo a ignorar..." class="w-full px-3 py-2 border rounded-lg text-xs focus:ring-2 focus:ring-blue-500">
          </div>
        </div>

        <button type="button" onclick="performAdvancedSearch()" class="w-full bg-blue-700 hover:bg-blue-800 text-white px-4 py-2.5 rounded-lg text-sm font-semibold shadow transition cursor-pointer flex items-center justify-center gap-2">
          <i class="ph-bold ph-magnifying-glass text-base"></i> Pesquisar Acervo
        </button>

        <div id="publicSearchResults" class="max-h-60 overflow-y-auto space-y-2 text-xs divide-y border rounded-lg p-3 bg-slate-50">
          <p class="text-slate-400 text-center py-4">Utilize os filtros acima para pesquisar obras no catálogo.</p>
        </div>

        <div class="text-center pt-2 border-t text-[11px] text-slate-500">
          Bibliotecário: <span class="font-bold text-slate-700">Igor Filipe Leal Negreiros (CRB 3/1779)</span>
        </div>
      </div>

      <!-- PAINEL LOGIN OPERADOR -->
      <div id="authPanelLogin" class="hidden space-y-4">
        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Utilizador / Operador</label>
            <div class="relative">
              <i class="ph-bold ph-user absolute left-3 top-3 text-slate-400 text-lg"></i>
              <input type="text" id="loginUser" required autocomplete="off" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs
