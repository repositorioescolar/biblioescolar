<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Gestão e Circulação de Acervo Escolar</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- SheetJS (XLSX Import/Export) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- JsBarcode -->
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <!-- html2pdf.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printableSheet, #printableSheet * { visibility: visible; }
      #printableSheet { position: absolute; left: 0; top: 0; width: 100%; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

  <!-- TELA DE LOGIN / CONSULTA PÚBLICA -->
  <div id="loginOverlay" class="fixed inset-0 bg-slate-900 bg-opacity-85 backdrop-blur-sm z-50 overflow-y-auto flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 max-w-lg w-full border border-slate-200 my-auto space-y-6">
      <div class="text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-100 text-blue-700 rounded-full mb-3">
          <i class="ph-bold ph-books text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-slate-800">Biblioteca Escolar</h2>
        <p class="text-slate-500 text-sm mt-1">Circulação, Acervo e Consulta Pública</p>
      </div>

      <div id="loginAlert" class="hidden p-3 bg-red-100 border border-red-300 text-red-700 text-sm rounded-lg text-center"></div>

      <!-- ABAS DA TELA DE ENTRADA -->
      <div class="flex border-b text-sm font-semibold">
        <button onclick="switchAuthTab('login')" id="authTabLogin" class="flex-1 py-2 text-blue-700 border-b-2 border-blue-700 text-center">Acesso Operador</button>
        <button onclick="switchAuthTab('public')" id="authTabPublic" class="flex-1 py-2 text-slate-500 text-center">Consulta Pública (Acervo)</button>
      </div>

      <!-- PAINEL DE LOGIN -->
      <div id="authPanelLogin" class="space-y-4">
        <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Utilizador / Operador</label>
            <div class="relative">
              <i class="ph-bold ph-user absolute left-3 top-3 text-slate-400 text-lg"></i>
              <input type="text" id="loginUser" required autocomplete="off" placeholder="Digite o seu utilizador" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Senha</label>
            <div class="relative">
              <i class="ph-bold ph-lock-key absolute left-3 top-3 text-slate-400 text-lg"></i>
              <input type="password" id="loginPass" required autocomplete="current-password" placeholder="Digite a sua senha" class="w-full pl-10 pr-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 text-sm">
            </div>
          </div>
          <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-semibold py-2.5 rounded-lg shadow-md transition text-sm flex items-center justify-center gap-2 cursor-pointer">
            <i class="ph-bold ph-sign-in text-lg"></i> Entrar no Sistema
          </button>
        </form>
      </div>

      <!-- PAINEL DE CONSULTA PÚBLICA -->
      <div id="authPanelPublic" class="hidden space-y-4">
        <p class="text-xs text-slate-600">Consulte o acervo da biblioteca por Título, Autor ou Assunto (Indexador):</p>
        <div class="flex gap-2">
          <input type="text" id="publicSearchInput" placeholder="Ex: Contos, Ruth Rocha, Matemática..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-blue-500">
          <button onclick="performPublicSearch()" class="bg-blue-700 hover:bg-blue-800 text-white px-4 py-2 rounded-lg text-sm font-semibold"><i class="ph-bold ph-magnifying-glass"></i></button>
        </div>
        <div id="publicSearchResults" class="max-h-60 overflow-y-auto space-y-2 text-xs divide-y">
          <p class="text-slate-400 text-center py-4">Digite um termo para pesquisar no acervo.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- CABEÇALHO -->
  <header id="mainHeader" class="bg-blue-900 text-white shadow-md sticky top-0 z-30 hidden">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i class="ph-bold ph-books text-2xl text-blue-300"></i>
        <div>
          <h1 class="font-bold text-lg leading-tight">Biblioteca Escolar</h1>
          <p id="headerSchoolName" class="text-xs text-blue-200">EEFTI Dr. Leão Sampaio</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="text-right text-xs">
          <span class="block text-blue-200">Operador Ativo:</span>
          <span id="currentUserDisplay" class="font-bold text-white text-sm">admin</span>
        </div>
        <button onclick="openPasswordModal()" class="bg-blue-800 hover:bg-blue-700 text-blue-100 px-3 py-1.5 rounded text-xs flex items-center gap-1 cursor-pointer">
          <i class="ph-bold ph-key"></i> Alterar Senha
        </button>
        <button onclick="handleLogout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded text-xs flex items-center gap-1 font-semibold cursor-pointer">
          <i class="ph-bold ph-sign-out"></i> Sair
        </button>
      </div>
    </div>

    <!-- TABS -->
    <nav class="bg-blue-950 text-blue-100 px-4 border-t border-blue-800">
      <div class="max-w-7xl mx-auto flex gap-1 overflow-x-auto text-sm font-medium">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-chart-pie"></i> Dashboard</button>
        <button onclick="switchTab('loans')" id="tab-loans" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-arrows-left-right"></i> Empréstimos</button>
        <button onclick="switchTab('students')" id="tab-students" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-student"></i> Alunos</button>
        <button onclick="switchTab('catalog')" id="tab-catalog" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-book-open"></i> Acervo</button>
        <button onclick="switchTab('staff')" id="tab-staff" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-users-three"></i> Responsáveis</button>
        <button onclick="switchTab('audit')" id="tab-audit" class="px-4 py-2.5 border-b-2 border-transparent hover:text-white flex items-center gap-2 transition cursor-pointer"><i class="ph-bold ph-list-checks"></i> Auditoria</button>
      </div>
    </nav>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main id="mainContent" class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full hidden space-y-6">

    <!-- DASHBOARD -->
    <section id="sec-dashboard" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
        <div onclick="switchTab('loans'); filterLoansBy('EMPRESTADO');" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between cursor-pointer hover:border-blue-500 transition group">
          <div>
            <p class="text-xs font-semibold text-slate-500 uppercase group-hover:text-blue-600">Empréstimos Ativos</p>
            <h3 id="dashActiveLoans" class="text-2xl font-bold text-slate-800
